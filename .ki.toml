# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# =============================================================================

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/knowledgeislands/mcp-ki-kb-notion-mirror"
title = "mcp-ki-kb-notion-mirror"
description = "MCP that mirrors local Knowledge Base markdown notes to a Notion wiki and records the resulting page URLs back into the notes' frontmatter"
repo_code = "MCP-NOTION"
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]
visibility = "public"

[skills.ki-authoring]

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-project]

[skills.ki-repo-mcp]

[skills.ki-guides]

# -----------------------------------------------------------------------------
# Governance and runtime
# -----------------------------------------------------------------------------

[skills.ki-engineering]

[skills.ki-decision-records]

# -----------------------------------------------------------------------------
# Change management
# -----------------------------------------------------------------------------

[skills.ki-git]

[skills.ki-work]
adapter = "roadmap"

[skills.ki-work-roadmap]
themes = ["tool-surface"]
areas.TOOL = "tool-surface"

[skills.ki-housekeeping-claude]

[skills.ki-tokenomics]

[skills.ki-tokenomics-claude]

[skills.ki-tokenomics-codex]

# -----------------------------------------------------------------------------
# Relationships
# -----------------------------------------------------------------------------

[skills.ki-trades]
routes."knowledgeislands/ki-agentic-harness" = { import = ["knowledge"] }

[skills.ki-agora]
memberships.ki-all = { home = "https://github.com/knowledgeislands/ki-arcadia-principal", role = "product" }
memberships.ki-mcps = { home = "https://github.com/knowledgeislands/ki-agentic-harness", role = "maintainer" }
